<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found | Modern Fisheries</title>
    <meta name="robots" content="noindex, follow" />
    <meta name="description" content="The requested page could not be found on Modern Fisheries." />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <style>
      body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background-color: #f8fafc;
        color: #1e293b;
        margin: 0;
        padding: 40px 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 80vh;
      }
      .card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        max-width: 520px;
        width: 100%;
        padding: 36px 32px;
        text-align: center;
        box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
      }
      .code {
        font-size: 48px;
        font-weight: 800;
        color: #0284c7;
        margin: 0 0 8px 0;
      }
      h1 {
        font-size: 22px;
        font-weight: 700;
        color: #0f172a;
        margin: 0 0 12px 0;
      }
      p {
        font-size: 15px;
        color: #64748b;
        line-height: 1.6;
        margin: 0 0 24px 0;
      }
      .links {
        display: flex;
        gap: 12px;
        justify-content: center;
        flex-wrap: wrap;
      }
      .btn {
        display: inline-block;
        background: #0284c7;
        color: #ffffff;
        text-decoration: none;
        font-weight: 600;
        padding: 10px 18px;
        border-radius: 8px;
        font-size: 14px;
      }
      .btn-outline {
        display: inline-block;
        background: #f1f5f9;
        color: #334155;
        text-decoration: none;
        font-weight: 600;
        padding: 10px 18px;
        border-radius: 8px;
        font-size: 14px;
      }
    </style>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      var pathSegmentsToKeep = 0;
      var l = window.location;
      
      // Known static or valid alias routes
      var knownRoutes = [
        "/home", "/ras", "/ras-farming", "/shopping", "/shop", "/aquaponics", 
        "/aquaponics-farming", "/aquaponic", "/biofloc", "/bioflock", 
        "/biofloc-farming", "/hydroponic", "/hydroponics", "/pond", 
        "/pond-farming", "/diseases", "/fish-diseases", "/feed", 
        "/feeding-management", "/calculator", "/calculators", "/services", 
        "/ourservices", "/about", "/about-us", "/videos", "/farming-videos", 
        "/faq", "/frequently-asked-questions", "/privacy", "/privacy-policy"
      ];
      
      var isKnown = knownRoutes.some(function(r) {
        return l.pathname.toLowerCase().indexOf(r) === 0;
      });

      if (isKnown || l.pathname.indexOf("/video/") === 0) {
        var cleanPath = l.pathname.replace(/^\/+/, "");
        l.replace(
          l.protocol + '//' + l.host + '/?p=/' +
          cleanPath.split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash
        );
      }
    </script>
  </head>
  <body>
    <div class="card">
      <div class="code">404</div>
      <h1>Page Not Found</h1>
      <p>
        The page you are looking for does not exist or has been moved. Explore our commercial aquaculture guides, calculators, and services below.
      </p>
      <div class="links">
        <a href="/" class="btn">Homepage</a>
        <a href="/ourservices" class="btn-outline">Consultancy &amp; Feed</a>
        <a href="/calculators" class="btn-outline">Calculators</a>
      </div>
    </div>
  </body>
</html>
